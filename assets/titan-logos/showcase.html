<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titan — Logo Design Exploration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            background: #FAFAFA;
            color: #1A1A1A;
            overflow-x: hidden;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .logo-card { transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
        .logo-card:hover { transform: translateY(-4px); }
        .logo-canvas { position: relative; transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
        .logo-aura {
            position: absolute; inset: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 70%);
            border-radius: 50%; transform: scale(0.5); opacity: 0;
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
            filter: blur(40px); pointer-events: none;
        }
        .logo-card:hover .logo-aura { transform: scale(1); opacity: 1; }
        .divider-line { width: 0; height: 1px; background: #1A1A1A; opacity: 0.2; transition: width 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
        .logo-card:hover .divider-line { width: 100%; }
        .tracking-ultra-wide { letter-spacing: 0.2em; }
        .text-balance { text-wrap: balance; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;

        const Titan01Concentric = () => (
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style={{width: '100%', height: '100%'}}>
                <g fill="currentColor">
                    <path d="M 50 12 A 38 38 0 0 1 88 50" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round"/>
                    <path d="M 88 50 A 38 38 0 0 1 50 88" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round"/>
                    <path d="M 50 88 A 38 38 0 0 1 12 50" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round"/>
                    <path d="M 12 50 A 38 38 0 0 1 50 12" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round"/>
                    <circle cx="50" cy="50" r="24" fill="none" stroke="currentColor" strokeWidth="2"/>
                    <circle cx="50" cy="50" r="10" fill="currentColor"/>
                    <circle cx="50" cy="26" r="2.5" fill="currentColor"/>
                    <circle cx="74" cy="50" r="2.5" fill="currentColor"/>
                    <circle cx="50" cy="74" r="2.5" fill="currentColor"/>
                    <circle cx="26" cy="50" r="2.5" fill="currentColor"/>
                </g>
            </svg>
        );

        const Titan02Hexagon = () => (
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style={{width: '100%', height: '100%'}}>
                <defs>
                    <polygon id="hex" points="5,0 2.5,4.33 -2.5,4.33 -5,0 -2.5,-4.33 2.5,-4.33" fill="currentColor"/>
                </defs>
                <g>
                    <use href="#hex" x="45" y="45" transform="scale(2.2)"/>
                    <use href="#hex" x="33" y="39"/>
                    <use href="#hex" x="45" y="39"/>
                    <use href="#hex" x="57" y="39"/>
                    <use href="#hex" x="27" y="50"/>
                    <use href="#hex" x="39" y="50"/>
                    <use href="#hex" x="51" y="50"/>
                    <use href="#hex" x="63" y="50"/>
                    <use href="#hex" x="33" y="61"/>
                    <use href="#hex" x="45" y="61"/>
                    <use href="#hex" x="57" y="61"/>
                    <circle cx="45" cy="45" r="3" fill="currentColor"/>
                </g>
            </svg>
        );

        const Titan03Hexagram = () => (
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style={{width: '100%', height: '100%'}}>
                <g fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                    <polygon points="50,18 75,68 25,68"/>
                    <polygon points="50,82 25,32 75,32"/>
                    <circle cx="50" cy="50" r="6" fill="currentColor" stroke="none"/>
                    <circle cx="50" cy="18" r="2.5" fill="currentColor" stroke="none"/>
                    <circle cx="75" cy="68" r="2.5" fill="currentColor" stroke="none"/>
                    <circle cx="25" cy="68" r="2.5" fill="currentColor" stroke="none"/>
                </g>
            </svg>
        );

        const Titan04Network = () => (
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style={{width: '100%', height: '100%'}}>
                <defs>
                    <clipPath id="network-clip">
                        <circle cx="50" cy="50" r="36"/>
                    </clipPath>
                </defs>
                <g clipPath="url(#network-clip)">
                    <line x1="10" y1="35" x2="90" y2="35" stroke="currentColor" strokeWidth="1.5"/>
                    <line x1="10" y1="45" x2="90" y2="45" stroke="currentColor" strokeWidth="2"/>
                    <line x1="10" y1="55" x2="90" y2="55" stroke="currentColor" strokeWidth="2"/>
                    <line x1="10" y1="65" x2="90" y2="65" stroke="currentColor" strokeWidth="1.5"/>
                    <line x1="30" y1="25" x2="30" y2="75" stroke="currentColor" strokeWidth="1.2"/>
                    <line x1="50" y1="25" x2="50" y2="75" stroke="currentColor" strokeWidth="1.8"/>
                    <line x1="70" y1="25" x2="70" y2="75" stroke="currentColor" strokeWidth="1.2"/>
                </g>
                <g fill="currentColor">
                    <circle cx="30" cy="35" r="3.5"/><circle cx="50" cy="35" r="3.5"/><circle cx="70" cy="35" r="3.5"/>
                    <circle cx="30" cy="45" r="4"/><circle cx="50" cy="45" r="5"/><circle cx="70" cy="45" r="4"/>
                    <circle cx="30" cy="55" r="4"/><circle cx="50" cy="55" r="5"/><circle cx="70" cy="55" r="4"/>
                    <circle cx="30" cy="65" r="3.5"/><circle cx="50" cy="65" r="3.5"/><circle cx="70" cy="65" r="3.5"/>
                </g>
            </svg>
        );

        const Titan05Arcs = () => (
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style={{width: '100%', height: '100%'}}>
                <g fill="none" stroke="currentColor" strokeWidth="2.8" strokeLinecap="round">
                    <path d="M 25 65 A 32 32 0 0 1 75 65"/>
                    <path d="M 30 60 A 26 26 0 0 1 70 60" strokeWidth="2"/>
                    <path d="M 36 55 A 18 18 0 0 1 64 55" strokeWidth="1.5"/>
                    <circle cx="50" cy="50" r="4" fill="currentColor" stroke="none"/>
                    <line x1="50" y1="22" x2="50" y2="30" strokeWidth="2.5"/>
                    <circle cx="50" cy="20" r="2.5" fill="currentColor" stroke="none"/>
                </g>
            </svg>
        );

        const Titan06Letter = () => (
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style={{width: '100%', height: '100%'}}>
                <g fill="currentColor">
                    <rect x="44" y="20" width="12" height="60" rx="2"/>
                    <rect x="20" y="20" width="60" height="12" rx="2"/>
                    <circle cx="50" cy="50" r="8" fill="none" stroke="#FAFAFA" strokeWidth="2.5"/>
                    <circle cx="26" cy="26" r="4"/>
                    <circle cx="74" cy="26" r="4"/>
                    <circle cx="50" cy="72" r="3"/>
                </g>
            </svg>
        );

        const LogoShowcase = () => {
            const logos = [
                {
                    Component: Titan01Concentric,
                    title: "Orbital Rings",
                    subtitle: "Concentric • Balanced",
                    philosophy: "Four quarter-arcs orbit a solid core, creating a sense of cyclical energy and eternal return. The radial dot accents reinforce the orbital theme."
                },
                {
                    Component: Titan02Hexagon,
                    title: "Honeycomb Matrix",
                    subtitle: "Hexagonal • Distributed",
                    philosophy: "A tessellated hexagon structure conveys distributed strength and efficient organization. The central node anchors the composition."
                },
                {
                    Component: Titan03Hexagram,
                    title: "Interlocking Triangles",
                    subtitle: "Geometric • Balanced",
                    philosophy: "Two triangles form a six-pointed star, balanced at the vertices. The center void creates negative space tension."
                },
                {
                    Component: Titan04Network,
                    title: "Grid Network",
                    subtitle: "Connected • Technical",
                    philosophy: "A clipped network grid with prominent nodes suggests connectivity and systematic architecture. Heavy center, light edges."
                },
                {
                    Component: Titan05Arcs,
                    title: "Stacked Arcs",
                    subtitle: "Layered • Dynamic",
                    philosophy: "Concentric arcs descending from a single point create a waterfall effect. The top anchor provides vertical balance."
                },
                {
                    Component: Titan06Letter,
                    title: "Typographic T",
                    subtitle: "Minimalist • Bold",
                    philosophy: "A bold letterform T with geometric cutouts and accent dots. Strong structural integrity with minimal elements."
                }
            ];

            return (
                <div className="min-h-screen flex flex-col items-center py-20 px-6">
                    <div className="text-center mb-20 max-w-3xl">
                        <h1 className="text-6xl md:text-7xl font-extralight tracking-wider mb-6">Titan</h1>
                        <p className="font-mono text-xs opacity-40 uppercase tracking-ultra-wide mb-8">Symmetric Monochromatic</p>
                        <div className="w-12 h-[1px] bg-[#1A1A1A] mx-auto opacity-30"></div>
                    </div>
                    <div className="max-w-7xl w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-16 mb-32">
                        {logos.map((logo, index) => (
                            <div key={index} className="flex flex-col items-center logo-card cursor-pointer">
                                <div className="w-64 h-64 mb-10 flex items-center justify-center relative">
                                    <div className="logo-aura"></div>
                                    <div className="w-32 h-32 relative z-10 logo-canvas">
                                        <logo.Component />
                                    </div>
                                </div>
                                <div className="text-center w-full px-4">
                                    <h2 className="text-xl font-medium tracking-wider mb-2 uppercase">{logo.title}</h2>
                                    <h3 className="text-xs font-mono opacity-50 tracking-widest mb-6">{logo.subtitle}</h3>
                                    <p className="text-sm leading-relaxed opacity-70 text-left font-light text-balance">{logo.philosophy}</p>
                                </div>
                                <div className="divider-line mt-8 mx-auto"></div>
                            </div>
                        ))}
                    </div>
                    <div className="mt-32 max-w-2xl text-center">
                        <p className="font-mono text-xs opacity-40 uppercase tracking-ultra-wide leading-loose">Generated with Logo Generator<br/>2026</p>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<LogoShowcase />, document.getElementById('root'));
    </script>
</body>
</html>
