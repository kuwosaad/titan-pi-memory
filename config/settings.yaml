# General Settings for Titan Memory v2

# Directories
output_dir: out
sessions_dir: out/sessions
memories_dir: out/memories
traces_dir: out/traces
graphs_dir: out/graphs

# File names (core)
memories_file: memories.json
memory_store_backend: sqlite
memory_store_sqlite_path: out/memories/memory_store.db
memory_store_read_fallback: none
trace_packets_file: trace_packets.json
trace_events_file: events.jsonl
event_index_file: event_index.json
checkpoints_file: checkpoints.json

# Sidecar graph outputs (not required for save/retrieve)
graph_file: graph.html
graph_artifacts_file: graph_artifacts.json

# Memory Extraction Settings
extraction_backend: gemini
min_memory_length: 6
max_fallback_sentences: 3

# Names used only when rendering new memory text. Agent-local settings may
# override these without changing the stable user/assistant speaker roles.
identity:
  user_display_name: User
  assistant_display_name: Assistant
  user_aliases: []
  assistant_aliases: []

# Server Settings
host: 127.0.0.1
port: 8000

# Ingest Settings
ingest_mode: event_first
plugin_spool_dir: .opencode/titan/traces
ingest_spool_mode: incremental
ingest_spool_max_lines_per_pass: 20000
ingest_debug_metrics_enabled: true

# Retrieval Settings
retrieval_enabled: true
retrieval_top_k: 8
retrieval_min_similarity: 0.25
retrieval_recency_days: null
retrieval_session_bias: true

# Conservative query-time duplicate collapse. This only changes visible retrieval
# results; stored memories and their scene provenance remain intact.
retrieval_dedup:
  enabled: true
  token_jaccard_threshold: 0.82
  embedding_similarity_threshold: 0.93
  embedding_min_token_containment: 0.75
  candidate_scan_multiplier: 3

# Final retrieval selection keeps the direct query match in control.
retrieval_selection:
  enabled: true
  hybrid_candidates_enabled: true
  candidate_pool_k: 34
  # Recall must not re-embed the vectorless corpus on every query. These rows
  # remain searchable by words; semantic paraphrases need an embedding repair.
  missing_embedding_mode: keyword

  query_aspects_enabled: true
  profile_aspect_expansion_enabled: true
  max_query_aspects: 3
  min_aspect_tokens: 2
  multi_aspect_pool_k: 60

  min_direct_similarity: 0.55
  profile_min_direct_similarity: 0.50
  strong_lexical_coverage: 0.80
  keyword_short_query_min_coverage: 0.50
  lexical_override_min_similarity: 0.25
  max_lexical_override_terms: 3

  user_profile_metadata_tiebreak_enabled: true
  profile_score_boost: 0.20
  profile_pattern_anchor_boost: 0.08
  lexical_coverage_weight: 0.05
  step2_score_weight: 0.10

# ──────────────────────────────────────────────
# Step 2.1: stateless attention between candidate memories (no LNN learning)
# ──────────────────────────────────────────────
step2:
  enabled: false
  alpha: 1.0
  # Phase A: Query-conditioned attention mask (Extension 2)
  attention_mask_enabled: true

  # Phase B: Explanatory centrality (Extension 1)
  centrality_enabled: true
  centrality_lambda: 0.3
  centrality_iterations: 2
  centrality_diversity_penalty: true

  # Shared attention matrix parameters
  sim_floor: 0.45
  softmax_temp: 0.5
  gate_offset: 2.0
  gate_steepness: 0.8
  residual_weight: 0.3

  # Intent-specific attention masks
  attention_mask:
    timeline:
      rough_to_rough: 0.35
      rough_to_learnings: 0.30
      learnings_to_rough: 0.20
      learnings_to_learnings: 0.15
    explanatory:
      rough_to_rough: 0.10
      rough_to_learnings: 0.15
      learnings_to_rough: 0.55
      learnings_to_learnings: 0.20
    pattern:
      rough_to_rough: 0.10
      rough_to_learnings: 0.10
      learnings_to_rough: 0.20
      learnings_to_learnings: 0.60
    decision:
      rough_to_rough: 0.15
      rough_to_learnings: 0.30
      learnings_to_rough: 0.10
      learnings_to_learnings: 0.45
    balanced:
      rough_to_rough: 0.25
      rough_to_learnings: 0.25
      learnings_to_rough: 0.25
      learnings_to_learnings: 0.25

  # Extension 4: Contradiction detection
  contradiction_enabled: true
  contradiction_sim_threshold: 0.7
  contradiction_tension_weight: 0.3
  contradiction_antonyms:
    - ["dark", "light"]
    - ["accept", "reject"]
    - ["use", "avoid"]
    - ["prefer", "dislike"]
    - ["work", "break"]
    - ["enable", "disable"]
    - ["keep", "remove"]
    - ["add", "drop"]

  # Extension 5: Cluster compression
  cluster_compression_enabled: true

  # Extension 6: Temporal attention head
  temporal_head_enabled: true
  temporal_tau_minutes: 30
  temporal_head_weight: 0.2
  semantic_head_weight: 0.8

# Memory Notes Settings
notes_max_items: 6
notes_max_chars: 700

# Pattern Generation Settings
patterns:
  enabled: true
  processor_version: "pattern-miner-v2"
  packet_mode: adaptive
  auto_mine_enabled: false
  record_applications_on_retrieval: false
  auto_mine_every_memories: 50
  batch_size: 100
  context_limit: 300
  min_evidence_count: 3
  min_scene_count: 2
  min_confidence_to_show: 0.45
  min_confidence_to_retrieve: 0.60
  retrieve_limit: 3
  coactivation_enabled: false
  high_signal_enabled: true
  semantic_cluster_enabled: true
  scene_episode_enabled: true
  entity_packets_enabled: true
  bridge_packets_enabled: true
  contradiction_packets_enabled: true
  cluster_min_memories: 3
  cluster_min_scenes: 2

# These settings belong to explicit cluster analysis, not retrieval ranking.
cluster_analysis:
  sim_floor: 0.45
  contradiction_sim_threshold: 0.7
  contradiction_antonyms:
    - ["dark", "light"]
    - ["accept", "reject"]
    - ["use", "avoid"]
    - ["prefer", "dislike"]
    - ["work", "break"]
    - ["enable", "disable"]
    - ["keep", "remove"]
    - ["add", "drop"]

# Router Settings
router_schema_version: v2
router_mode: rule_based

# Source Reliability Configuration
source_reliability:
  user: 0.9
  assistant: 0.3
  code: 1.0
  mixed: 0.5
  legacy: 0.3

# Retrieval Filtering
retrieval:
  min_reliability: 0.4
  allow_unverified: true
  show_source_notes: false
