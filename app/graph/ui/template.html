<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Titan memory graph</title>
    <link rel="icon" type="image/svg+xml" href="${brand_mark_url}">
    <style>${styles}</style>
</head>
<body>
    <header class="masthead">
        <button type="button" class="icon-button sidebar-toggle" id="sidebarToggle" aria-label="Toggle saved memories" aria-controls="memorySidebar" aria-expanded="true" title="Toggle saved memories"><span aria-hidden="true" class="sidebar-icon"></span></button>
        <div class="brand">
            <img class="brand-mark" src="${brand_mark_url}" alt="">
            <span class="wordmark">titan</span>
        </div>
        <h1>Memory graph</h1>
        <span class="scope">${scope_label}</span>
    </header>
    <main class="workspace" id="workspace">
        <aside class="memory-sidebar" id="memorySidebar" aria-label="Saved memories">
            <div class="sidebar-heading"><h2>Saved memories</h2><span id="sidebarCount" class="list-count"></span></div>
            <div class="memory-search">
                <label for="sidebarSearch">Search memories</label>
                <input id="sidebarSearch" type="search" aria-label="Search memories" autocomplete="off">
            </div>
            <div class="memory-filters">
                <div class="segmented" aria-label="Memory date range" id="memoryViewSwitch">
                    <button type="button" data-view="recent" aria-pressed="true" title="Past 24 hours">Recent</button>
                    <button type="button" data-view="all" aria-pressed="false">All</button>
                </div>
                <div class="memory-type">
                    <label for="typeFilter">Type</label>
                    <select id="typeFilter" aria-label="Filter by memory type"><option value="">All types</option></select>
                </div>
            </div>
            <div id="memoryList" class="memory-list" role="list"></div>
            <p id="sidebarEmpty" class="sidebar-empty" hidden>No matching memories</p>
        </aside>
        <div class="sidebar-scrim" id="sidebarScrim" aria-hidden="true" hidden></div>
        <section class="graph-stage" id="graphStage" aria-label="Memory graph">
            <canvas id="graph" tabindex="0" aria-label="Memory graph. Drag to pan. Use arrow keys to pan and plus or minus to zoom. Use the saved memories list to open a memory."></canvas>
            <div class="graph-toolbar">
                <div class="graph-summary">
                    <span id="graphStats" role="status"></span>
                    <div class="focus-context" id="focusContext" hidden><span id="focusAnchor"></span><button type="button" class="focus-reset" id="clearFocus">Clear focus</button></div>
                </div>
                <label class="edge-filter"><span>Links</span><select id="relationshipFilter" aria-label="Show links"><option value="all">All</option><option value="similarity">Similarity</option><option value="supersedes">Corrections</option></select></label>
            </div>
            <div class="graph-empty" id="graphEmpty" hidden><strong>No memories found</strong><span id="emptyDetail"></span></div>
            <div class="graph-footer">
                <div class="graph-key">
                    <div class="graph-legend" aria-label="Link legend">
                        <span data-link-kind="similarity"><i class="legend-line" aria-hidden="true"></i>Similarity</span>
                        <span data-link-kind="supersedes"><i class="legend-line correction-line" aria-hidden="true"></i>Correction</span>
                    </div>
                    <details class="graph-layout" id="graphLayout">
                        <summary>Layout</summary>
                        <form class="graph-layout-panel" id="graphLayoutForm" aria-label="Graph layout">
                            <fieldset id="graphForces">
                                <legend>Forces</legend>
                                <label>Center force <input name="centerStrength" type="range" min="0" max="1" step="0.01" value="0.1"></label>
                                <label>Repel force <input name="repelStrength" type="range" min="0" max="20" step="0.1" value="10"></label>
                                <label>Link force <input name="linkStrength" type="range" min="0" max="1" step="0.01" value="1"></label>
                                <label>Link distance <input name="linkDistance" type="range" min="30" max="500" value="250"></label>
                            </fieldset>
                            <fieldset id="graphDisplay">
                                <legend>Display</legend>
                                <label>Node size <input name="nodeSize" type="range" min="0.5" max="2.5" step="0.1" value="1"></label>
                                <label>Link width <input name="linkWidth" type="range" min="0.5" max="3" step="0.1" value="1"></label>
                            </fieldset>
                            <label id="localDepthField" hidden>Neighborhood depth <input name="localDepth" type="range" min="1" max="5" value="1"></label>
                            <div class="graph-layout-actions">
                                <button type="button" id="reheatGraph">Rebalance</button>
                                <button type="reset">Reset</button>
                            </div>
                        </form>
                    </details>
                </div>
                <div class="camera-controls" aria-label="Graph camera controls">
                    <button type="button" class="icon-button" id="zoomOut" aria-label="Zoom out" title="Zoom out">−</button>
                    <span id="zoomValue">100%</span>
                    <button type="button" class="icon-button" id="zoomIn" aria-label="Zoom in" title="Zoom in">+</button>
                    <button type="button" class="fit-button" id="fitGraph">Fit</button>
                </div>
            </div>
        </section>
    </main>
    <dialog class="memory-preview" id="memoryPreview" aria-labelledby="memoryPreviewTitle">
        <header class="preview-header">
            <h2 id="memoryPreviewTitle">Memory</h2>
            <span class="preview-load-status" id="previewLoadStatus" role="status"></span>
            <button class="icon-button" id="memoryPreviewClose" type="button" aria-label="Close preview" autofocus>×</button>
        </header>
        <div class="preview-scroll" id="previewScroll">
            <div id="previewContent">
                <p class="preview-text" id="memoryPreviewBody" tabindex="-1"></p>
                <dl class="preview-meta" id="memoryPreviewMeta"></dl>
                <details class="preview-identifiers"><summary>Memory identifiers</summary><div id="memoryIdentifiers"></div></details>
                <p class="preview-note" id="previewScope" hidden>Outside the current graph and list</p>
                <div id="memoryPreviewEvidence" hidden></div>
                <section id="memoryPreviewConnections" class="preview-section" hidden>
                    <h3>Similar memories</h3><div id="similarMemories" class="preview-links"></div>
                </section>
            </div>
        </div>
        <footer class="preview-actions" id="previewActions" hidden><button type="button" id="focusMemory">Focus neighborhood</button></footer>
    </dialog>
    <script id="graphPhysics" type="application/json">${physics_script}</script>
    <script>${canvas_script}</script>
    <script>${client_script}</script>
</body>
</html>
