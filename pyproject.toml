[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "titan-memory-cli"
version = "0.1.0"
description = "Titan Memory CLI and local-first memory runtime for coding agents"
readme = "docs/pypi_titan_memory_cli.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["memory", "codex", "mcp", "agent", "recall"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastapi",
  "uvicorn",
  "requests",
  "pyyaml",
  "numpy",
  "networkx",
  "pydantic",
  "mcp>=1.5.0,<2",
  "rich",
  "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
titan = "tools.cli.titan:main"

[project.urls]
Homepage = "https://github.com/kuwosaad/titan-pi-memory"
Repository = "https://github.com/kuwosaad/titan-pi-memory"
"Codex Plugin" = "https://github.com/kuwosaad/titan-pi-memory/tree/main/integrations/codex_titan_plugin"
"Claude Code Plugin" = "https://github.com/kuwosaad/titan-pi-memory/tree/main/integrations/claude_titan_plugin"
Issues = "https://github.com/kuwosaad/titan-pi-memory/issues"

[tool.setuptools.packages.find]
include = ["app*", "tools*", "entrypoints*", "config*", "integrations*"]
exclude = [
  "entrypoints.overnight*",
  "tools.benchmarks*",
  "tools.dev*",
  "tools.pi_extension*",
  "tools.presentations*",
  "tools.release*",
  "tools.scripts*",
]

[tool.setuptools.package-data]
config = [
  ".env.example",
  "embedding_models.yaml",
  "extraction_models.yaml",
  "settings.yaml",
  "visual_config.yaml",
]
"integrations.codex_titan_plugin" = [
  "README.md",
  "PRIVACY.md",
  "TERMS.md",
  ".mcp.json",
  ".agents/plugins/*.json",
  ".codex-plugin/*.json",
  "assets/*.png",
  "hooks/*.json",
  "scripts/*.py",
  "skills/*/SKILL.md",
]
"integrations.claude_titan_plugin" = [
  "README.md",
  "PRIVACY.md",
  "TERMS.md",
  ".mcp.json",
  ".claude-plugin/*.json",
  "hooks/*.json",
  "scripts/*.py",
  "scripts/*.js",
  "runtime/*.py",
  "runtime/*.js",
  "skills/*/SKILL.md",
  "package.json",
  "package-lock.json",
]
