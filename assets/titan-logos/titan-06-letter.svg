<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <g fill="currentColor">
    <!-- Stylized T - vertical stem -->
    <rect x="44" y="20" width="12" height="60" rx="2"/>
    <!-- T - horizontal bar -->
    <rect x="20" y="20" width="60" height="12" rx="2"/>
    <!-- Geometric cutouts creating symmetry -->
    <circle cx="50" cy="50" r="8" fill="none" stroke="#FAFAFA" stroke-width="2.5"/>
    <!-- Accent circles at bar ends -->
    <circle cx="26" cy="26" r="4"/>
    <circle cx="74" cy="26" r="4"/>
    <!-- Bottom accent dots -->
    <circle cx="50" cy="72" r="3"/>
  </g>
</svg>