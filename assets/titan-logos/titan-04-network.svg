<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="titan-network-clip">
      <circle cx="50" cy="50" r="36"/>
    </clipPath>
  </defs>
  <g clip-path="url(#titan-network-clip)">
    <!-- Horizontal lines creating network effect -->
    <line x1="10" y1="35" x2="90" y2="35" stroke="currentColor" stroke-width="1.5"/>
    <line x1="10" y1="45" x2="90" y2="45" stroke="currentColor" stroke-width="2"/>
    <line x1="10" y1="55" x2="90" y2="55" stroke="currentColor" stroke-width="2"/>
    <line x1="10" y1="65" x2="90" y2="65" stroke="currentColor" stroke-width="1.5"/>
    <!-- Vertical connections -->
    <line x1="30" y1="25" x2="30" y2="75" stroke="currentColor" stroke-width="1.2"/>
    <line x1="50" y1="25" x2="50" y2="75" stroke="currentColor" stroke-width="1.8"/>
    <line x1="70" y1="25" x2="70" y2="75" stroke="currentColor" stroke-width="1.2"/>
  </g>
  <!-- Key nodes -->
  <g fill="currentColor">
    <circle cx="30" cy="35" r="3.5"/>
    <circle cx="50" cy="35" r="3.5"/>
    <circle cx="70" cy="35" r="3.5"/>
    <circle cx="30" cy="45" r="4"/>
    <circle cx="50" cy="45" r="5"/>
    <circle cx="70" cy="45" r="4"/>
    <circle cx="30" cy="55" r="4"/>
    <circle cx="50" cy="55" r="5"/>
    <circle cx="70" cy="55" r="4"/>
    <circle cx="30" cy="65" r="3.5"/>
    <circle cx="50" cy="65" r="3.5"/>
    <circle cx="70" cy="65" r="3.5"/>
  </g>
</svg>